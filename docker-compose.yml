services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm:crm@db:5432/crm?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-troque-este-segredo-em-producao}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
